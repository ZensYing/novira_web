<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }
  .container { max-width: 1140px; margin: 0 auto; }
  
  .distributorship-card {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    background: #022019 url('../images/distributer.png') no-repeat center right / cover;
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 44px 56px;
    box-shadow: 0 20px 45px rgba(1, 24, 18, 0.25);
  }
  
  .distributorship-content {
    max-width: 480px;
    z-index: 2;
  }
  
  .distributorship-title {
    font-size: clamp(26px, 3.2vw, 38px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: #ffffff;
    margin-bottom: 14px;
  }
  
  .distributorship-subtitle {
    font-size: clamp(13.5px, 1.2vw, 15px);
    line-height: 1.5;
    color: #bde0d5;
    margin-bottom: 26px;
  }
  
  .distributorship-cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    color: #0b221b;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 26px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  
  .distributorship-cta-btn:hover {
    background: #f0fbf7;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  
  .distributorship-visual {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 320px;
    margin-right: 20px;
  }
  
  .distributorship-vials-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .distributorship-vials-img {
    width: clamp(200px, 22vw, 250px);
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
  }

  @media (max-width: 900px) {
    .distributorship-card {
      padding: 36px 32px;
      min-height: 300px;
    }
    .distributorship-visual {
      width: 240px;
      margin-right: 0;
    }
  }

  @media (max-width: 768px) {
    .distributorship-card {
      flex-direction: column;
      text-align: center;
      padding: 36px 24px;
      background-position: center bottom;
    }
    .distributorship-content {
      max-width: 100%;
      margin-bottom: 24px;
    }
    .distributorship-cta-btn {
      margin: 0 auto;
    }
    .distributorship-visual {
      width: 100%;
      margin-right: 0;
    }
    .distributorship-vials-img {
      width: 180px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="distributorship-card">
      <div class="distributorship-content">
        <h2 class="distributorship-title">Contact us<br>for Distributorship</h2>
        <p class="distributorship-subtitle">For Partnership inquiries and to explore how we can work together.</p>
        <a href="#enquiry-form" class="distributorship-cta-btn">
          <span>Contact Us &gt;</span>
        </a>
      </div>
      <div class="distributorship-visual">
        <div class="distributorship-vials-wrap">
          <img src="../images/exoluma/set.png" class="distributorship-vials-img">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
